<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join me on Gamefolio!</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Join me on Gamefolio!" />
  <meta property="og:description" content="Use my referral code to sign up and earn 100 bonus XP. The ultimate mobile gaming portfolio app." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{REFERRAL_URL}}" />
  <meta property="og:image" content="https://gamefolio.app/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Join me on Gamefolio!" />
  <meta name="twitter:description" content="Use my referral code to sign up and earn 100 bonus XP." />
  <meta name="twitter:image" content="https://gamefolio.app/og-image.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a1628;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4ADE80 0%, #22d3ee 100%);
      border-radius: 20px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 0 32px rgba(74, 222, 128, 0.3);
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #94A3B8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .code-box {
      background: rgba(74, 222, 128, 0.08);
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 14px;
      padding: 18px 24px;
      margin-bottom: 32px;
    }

    .code-label {
      font-size: 12px;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .code-value {
      font-size: 28px;
      font-weight: 800;
      color: #4ADE80;
      letter-spacing: 4px;
      font-family: 'Courier New', monospace;
    }

    .xp-badge {
      display: inline-block;
      background: rgba(74, 222, 128, 0.15);
      color: #4ADE80;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 32px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.15s;
      margin-bottom: 12px;
    }

    .btn:active { opacity: 0.75; }

    .btn-primary {
      background: linear-gradient(135deg, #4ADE80 0%, #22c55e 100%);
      color: #0a1628;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .status {
      color: #64748B;
      font-size: 13px;
      margin-top: 24px;
      line-height: 1.5;
    }

    .status a {
      color: #4ADE80;
      text-decoration: none;
    }

    /* Desktop-only QR section */
    .qr-section {
      display: none;
    }

    @media (min-width: 640px) {
      .qr-section {
        display: block;
        margin-top: 24px;
        padding-top: 24px;
        border-top: 1px solid rgba(255,255,255,0.06);
      }

      .qr-label {
        color: #64748B;
        font-size: 13px;
        margin-bottom: 14px;
      }

      .qr-img {
        width: 140px;
        height: 140px;
        border-radius: 12px;
        background: #fff;
        padding: 8px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🎮</div>

    <h1>Join me on Gamefolio!</h1>
    <p class="subtitle">
      Your ultimate gaming portfolio. Showcase clips, reels, and screenshots from your favorite games.
    </p>

    <div class="code-box">
      <div class="code-label">Your Referral Code</div>
      <div class="code-value" id="refCode">{{CODE}}</div>
    </div>

    <div class="xp-badge">+100 XP when you sign up</div>

    <a id="appStoreBtn" class="btn btn-primary" href="#" onclick="return openApp();">
      Download Gamefolio
    </a>

    <p class="status" id="statusText">
      Opening the app store&hellip;
    </p>

    <div class="qr-section">
      <p class="qr-label">Scan to open on your phone</p>
      <img
        class="qr-img"
        src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data={{REFERRAL_URL_ENCODED}}&bgcolor=ffffff&color=0a1628&margin=4"
        alt="QR code for referral link"
      />
    </div>
  </div>

  <script>
    var CODE = '{{CODE}}';
    var IOS_STORE_URL = '{{APP_STORE_ID}}' !== 'PLACEHOLDER'
      ? 'https://apps.apple.com/app/id{{APP_STORE_ID}}'
      : 'https://apps.apple.com/search?term=Gamefolio';
    var ANDROID_STORE_URL = 'https://play.google.com/store/apps/details?id=app.rork.gamefolio';
    var CUSTOM_SCHEME_URL = 'rork-app://?ref=' + encodeURIComponent(CODE);

    function isIOS() {
      return /iPhone|iPad|iPod/.test(navigator.userAgent);
    }
    function isAndroid() {
      return /Android/.test(navigator.userAgent);
    }
    function isMobile() {
      return isIOS() || isAndroid();
    }

    var appStoreBtn = document.getElementById('appStoreBtn');
    var statusText = document.getElementById('statusText');

    // Set the right store URL
    if (isIOS()) {
      appStoreBtn.href = IOS_STORE_URL;
      statusText.textContent = 'Trying to open Gamefolio\u2026';
    } else if (isAndroid()) {
      appStoreBtn.href = ANDROID_STORE_URL;
      statusText.textContent = 'Trying to open Gamefolio\u2026';
    } else {
      // Desktop — just show the card with QR
      appStoreBtn.style.display = 'none';
      statusText.innerHTML = 'Scan the QR code below with your phone, or search for <strong>Gamefolio</strong> in your app store.';
    }

    function openApp() {
      if (!isMobile()) return true; // let href handle it

      // Try to open via custom scheme
      var start = Date.now();
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = CUSTOM_SCHEME_URL;
      document.body.appendChild(iframe);

      // After 2.5s, if the user hasn't left the page, assume app isn't installed
      setTimeout(function() {
        if (document.hidden || Date.now() - start > 3000) {
          return; // app opened and user left
        }
        // App not installed — go to store
        window.location.href = isIOS() ? IOS_STORE_URL : ANDROID_STORE_URL;
      }, 2500);

      return false; // prevent default href nav
    }

    // Auto-trigger on mobile page load
    if (isMobile()) {
      // Small delay so page renders first
      setTimeout(function() {
        openApp();
      }, 400);
    }

    // Visibility change: if user comes back quickly, app probably didn't open
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        statusText.innerHTML = 'App not installed? <a href="' +
          (isIOS() ? IOS_STORE_URL : ANDROID_STORE_URL) + '">Download Gamefolio</a>';
      }
    });
  </script>
</body>
</html>
